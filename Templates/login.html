<!doctype html>
    <html>
        <head>
            <meta charset='utf-8'>
            <meta name='viewport' content='width=device-width, initial-scale=1'>
            <title>Login Page</title>
            <link href='https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css' rel='stylesheet'>
            <link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.0.3/css/font-awesome.css' rel='stylesheet'>
            <style>body {
    color: #000;
    overflow-x: hidden;
    height: 100%;
    background-image: url("/static/image.png");
    background-repeat: no-repeat;
    background-size: 100% 100%
}

.card {
    padding: 30px 40px;
    margin-top: 60px;
    margin-bottom: 60px;
    border: none !important;
    box-shadow: 0 6px 12px 0 rgba(0, 0, 0, 0.2)
}

.blue-text {
    color: #00BCD4
}

.form-control-label {
    margin-bottom: 0
}

input,
textarea,
button {
    padding: 8px 15px;
    border-radius: 5px !important;
    margin: 5px 0px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    font-size: 18px !important;
    font-weight: 300
}

input:focus,
textarea:focus {
    -moz-box-shadow: none !important;
    -webkit-box-shadow: none !important;
    box-shadow: none !important;
    border: 1px solid #00BCD4;
    outline-width: 0;
    font-weight: 400
}

.btn-block {
    text-transform: uppercase;
    font-size: 15px !important;
    font-weight: 400;
    height: 43px;
    cursor: pointer
}

.btn-block:hover {
    color: #fff !important
}

.register {
  background: none!important;
  border: none;
  padding: 0!important;
  /*optional*/
  font-family: arial, sans-serif;
  /*input has OS specific font-family*/
  font-size: 1.3em;
  color: #069;
  text-decoration: underline;
  cursor: pointer;
  }


button:focus {
    -moz-box-shadow: none !important;
    -webkit-box-shadow: none !important;
    box-shadow: none !important;
    outline-width: 0
    }</style>
        </head>
        <body oncontextmenu='return false' class='snippet-body'>
        <div class="container-fluid px-1 py-5 mx-auto">
        <div class="row d-flex justify-content-center">
            <div class="col-xl-4 col-lg-8 col-md-9 col-11 text-center">
                <h3>Request a Demo</h3>
                <form action="/register">
                     <button type="submit" value="register" name="submit" class="register">New User? Register</button>
                </form>
                <p class="blue-text">Just answer a few questions<br> so that we can personalize the right experience for you.</p>
                <div class="card">
                    <!--
                    User's Data User Id | First Name    | Second Name   | Mobile Number |DOB    |Gender |Admin


                    -->
                    <form action = "\login" method = "POST" class="form-card" >
                        <div class="row justify-content-between text-center">
                            <div class="form-group col-sm-6 "> <label class="form-control-label px-3">Username<span class="text-danger"> *</span></label> <input type="text" id="uname" name="uname" placeholder="Enter your Username" required> </div>
                        </div>
                        <div class="row justify-content-between text-center">
                            <div class="form-group col-sm-6 "> <label class="form-control-label px-3">Password<span class="text-danger"> *</span></label> <input type="password" id="pass" name="pass" placeholder="Enter your Password" autocomplete="off" required> </div>
                        </div>
                        <div class="row justify-content-between text-center">
                            <div class="form-group col-sm-6 "> <label class="form-control-label px-3">Enter OTP<span class="text-danger"> *</span></label> <input type="text" id="otp" name="otp" placeholder="Enter OTP" autocomplete="off" required> </div>
                        </div>
                        <div class="row justify-content-between text-center">
                            <div class="form-group col-sm-6"><button type="button" formmethod="POST" class="btn-block btn-primary">Request OTP</button></div>
                        </div>
                        <div class="row justify-content-between text-center">
                            <div class="form-group col-sm-6"><button type="submit" formmethod="POST" class="btn-block btn-primary">LOG IN</button></div>
                        </div>
                     </form>
            </div>
        </div>
    </div>
</div>
        </body>
</html>
